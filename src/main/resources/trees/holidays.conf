// Holiday events (EnthusiaHolidays). Every node is granted by command, never by gameplay:
//   advancements grant <player> holidays <key>
// Keys are year-agnostic so each year's events reuse them. Rewards are paid by EnthusiaHolidays,
// so these nodes carry none.
namespace = "holidays"
background-texture = "minecraft:textures/block/snow.png"

nodes = [
    {
        key = "holidays_root"
        title = "Holiday Events"
        description = ["Seasonal hunts, calendars and gifts"]
        icon = "CAKE"
        frame = "TASK"
        x = 0.0
        y = 0.0
        max-progression = 1
    },

    // === HALLOWEEN ===
