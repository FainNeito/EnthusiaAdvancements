name: EnthusiaAdvancements
version: 1.0.0-pilot.7
main: io.github.badgersmc.advancements.pilot.PilotPlugin
commands:
  enthusia-export-catalogue:
    description: Export registered provider definitions on an isolated local restore
    permission: enthusiaadvancements.local-export
permissions:
  enthusiaadvancements.local-export:
    default: op
api-version: '26.2'
depend: [UltimateAdvancementAPI]
softdepend: [DiscordSRV, InteractiveChat, InteractiveChatDiscordSrvAddon]
description: Projection-only Enthusia advancement renderer; no bundled challenge or reward execution.
